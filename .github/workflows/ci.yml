name: Stet CI/CD

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-mac:
    name: Test (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest test suite
        run: |
          python -m pytest tests/ -v

  test-win:
    name: Test (Windows)
    runs-on: windows-latest
    continue-on-error: true  # pre-existing Qt GC access violation on GitHub runners

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest test suite
        run: |
          python -m pytest tests/ -v

  build-mac:
    name: Build macOS DMG Package
    needs: test-mac
    runs-on: macos-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller

      - name: Build macOS App & DMG
        run: |
          chmod +x build_mac.command run_mac.command scripts/macos/*.py
          python build.py --macos-arch auto --allow-missing-macos-backend

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stet-macOS-Installer
          path: dist/*.dmg
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: build-mac
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: Stet-macOS-Installer
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Stet v${{ github.ref_name }}"
          body: |
            ## Stet v${{ github.ref_name }}

            ### What's New
            See the [commit](https://github.com/AmrZriek/Stet/commit/${{ github.sha }}) for the full changelog.

            ### macOS (ALPHA)
            - 🍎 **macOS native support** — `.app` bundle with Apple Silicon Metal acceleration
            - Permission onboarding for Accessibility + Input Monitoring
            - Login item management via SMAppService
            - Sandbox-safe Application Support paths
            - Immutable bundle-safe self-update

            ### Downloads
            - **Windows:** Download `StetSetup.exe` from the Assets section
            - **macOS:** Download `Stet-macOS.dmg` from the Assets section
          files: dist/*.dmg
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: false
