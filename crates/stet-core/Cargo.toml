[package]
name = "stet-core"
version = "1.5.0"
edition = "2021"
authors = ["Stet"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
ffi-skel = { path = "../stet-win32" }
stet-uia-broker = { path = "../stet-uia-broker" }

[dev-dependencies]